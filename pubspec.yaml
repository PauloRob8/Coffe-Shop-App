name: CoffeShopApp
description: A new Flutter project.

# The following line prevents the package from being accidentally published to
# pub.dev using `pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ">=2.7.0 <3.0.0"

dependencies:
  flutter:
    sdk: flutter
  
  #UI
  cupertino_icons: ^0.1.3
  font_awesome_flutter: ^8.7.0
  neumorphic: ^0.3.2
  icon_shadow: ^1.0.1
  #BloC
  flutter_bloc: ^5.0.0
  equatable: ^1.2.0
  #Cubit
  flutter_cubit: ^0.1.0
  #Tests
  mockito: ^4.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:

  uses-material-design: true

  assets:
    - assets/drawable-hdpi/Profile pic.png
    - assets/drawable-hdpi/Profile pic.jpg
    - lib/repository/itens_repository.json
    - assets/drawable-hdpi/coffe_cup.png
    - assets/drawable-hdpi/coffe_cup1.png
    - assets/drawable-hdpi/coffee_cup2.png
    - assets/drawable-hdpi/coffee_cup3.png
    - assets/drawable-hdpi/tea_cup.png
    - assets/drawable-hdpi/cart.png
    - assets/drawable-hdpi/home.png
    - assets/drawable-hdpi/add.png

  fonts:
    - family: AbrilFatFace
      fonts:
        - asset: assets/fonts/AbrilFatface-Regular.ttf
  
    - family: OpenSans
      fonts:
        - asset: assets/fonts/OpenSans-Regular.ttf