name: CoffeShopApp
description: A new Flutter project.

# The following line prevents the package from being accidentally published to
# pub.dev using `pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ">=2.7.0 <3.0.0"

dependencies:
  flutter:
    sdk: flutter
  
  #UI
  cupertino_icons: ^0.1.3
  font_awesome_flutter: ^8.7.0
  #BloC
  flutter_bloc: ^4.0.1
  equatable: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:

  uses-material-design: true

  assets:
    - lib/assets/drawable-hdpi/Profile pic.png
    - lib/assets/drawable-hdpi/Profile pic.jpg
    - lib/repository/itens_repository.json
    - lib/assets/drawable-hdpi/coffe_cup.png
    - lib/assets/drawable-hdpi/tea_cup.png

  fonts:
    - family: AbrilFatFace
      fonts:
        - asset: lib/assets/fonts/AbrilFatface-Regular.ttf
  
    - family: OpenSans
      fonts:
        - asset: lib/assets/fonts/OpenSans-Regular.ttf